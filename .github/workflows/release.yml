name: Build & Release (Windows x64)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.100.0"

      # Official (tagged) releases always build from a clean workspace — never from a restored cache.
      - name: Cache Cargo registry & build artifacts
        if: github.ref_type != 'tag'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Run workspace tests
        run: cargo test --workspace --locked

      - name: Build VST3 & CLAP plugins
        run: cargo xtask bundle dawstream-vst3 --release --locked

      - name: Build DAWStream companion app
        run: cargo build --release --locked -p dawstream-app

      - name: Package release archive & SHA-256 checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release/DAWStream" | Out-Null
          Copy-Item "target/release/dawstream-app.exe" "release/DAWStream/DAWStream.exe" -Force
          Copy-Item "target/bundled/dawstream-vst3.vst3" "release/DAWStream/DAWStream.vst3" -Recurse -Force
          if (Test-Path "target/bundled/dawstream-vst3.clap") {
            Copy-Item "target/bundled/dawstream-vst3.clap" "release/DAWStream/DAWStream.clap" -Force
          }
          Copy-Item "Install.bat" "release/DAWStream/Install.bat" -Force
          Copy-Item "README.md" "release/DAWStream/README.md" -Force
          Copy-Item "LICENSE" "release/DAWStream/LICENSE" -Force

          $tag = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "dev" }
          $zipName = "DAWStream-$tag-windows-x64.zip"
          Compress-Archive -Path "release/DAWStream/*" -DestinationPath $zipName -Force

          $hash = (Get-FileHash -Path $zipName -Algorithm SHA256).Hash.ToLower()
          "$hash  $zipName" | Out-File -FilePath "SHA256SUMS.txt" -Encoding ascii

          New-Item -ItemType Directory -Force -Path "dist-upload" | Out-Null
          Move-Item $zipName "dist-upload/"
          Move-Item "SHA256SUMS.txt" "dist-upload/"

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DAWStream-windows-x64
          path: dist-upload/*

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: DAWStream-windows-x64
          path: dist-upload

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist-upload/*
          generate_release_notes: true
